name: Build iNetCDF iOS

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub UI

env:
  PYTHON_VERSION: "3.11"
  IOS_MIN_VERSION: "15.0"
  ZLIB_VERSION: "1.3.1"
  HDF5_VERSION: "1.14.3"
  NETCDF_VERSION: "4.9.2"
  NETCDF4_PY_VERSION: "1.6.5"

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          pip install briefcase crossenv
          brew install cmake

      # ── iOS SDK environment ──────────────────────────────────────────────
      - name: Set up iOS SDK environment
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos --find clang)
          DEPS=$GITHUB_WORKSPACE/ios-deps
          mkdir -p $DEPS/{lib,include,bin}
          echo "IOS_SDK=$SDK"   >> $GITHUB_ENV
          echo "IOS_CC=$CC"     >> $GITHUB_ENV
          echo "DEPS_DIR=$DEPS" >> $GITHUB_ENV

      # ── zlib ─────────────────────────────────────────────────────────────
      - name: Build zlib for iOS (arm64, shared)
        run: |
          curl -LO https://github.com/madler/zlib/releases/download/v${{ env.ZLIB_VERSION }}/zlib-${{ env.ZLIB_VERSION }}.tar.gz
          tar xzf zlib-${{ env.ZLIB_VERSION }}.tar.gz
          cd zlib-${{ env.ZLIB_VERSION }}
          CC="$IOS_CC" \
          CFLAGS="-arch arm64 -isysroot $IOS_SDK -miphoneos-version-min=${{ env.IOS_MIN_VERSION }}" \
          ./configure \
            --prefix=$DEPS_DIR \
            --archs="-arch arm64"
          make -j$(sysctl -n hw.ncpu)
          make install
          # Also build shared
          CC="$IOS_CC" \
          CFLAGS="-arch arm64 -isysroot $IOS_SDK -miphoneos-version-min=${{ env.IOS_MIN_VERSION }} -fPIC" \
          clang -arch arm64 -isysroot $IOS_SDK \
            -miphoneos-version-min=${{ env.IOS_MIN_VERSION }} \
            -shared -o $DEPS_DIR/lib/libz.dylib \
            -install_name @rpath/libz.dylib \
            zlib-${{ env.ZLIB_VERSION }}/*.o 2>/dev/null || \
          $IOS_CC -arch arm64 -isysroot $IOS_SDK \
            -miphoneos-version-min=${{ env.IOS_MIN_VERSION }} \
            -dynamiclib -o $DEPS_DIR/lib/libz.dylib \
            -install_name @rpath/libz.dylib \
            zlib-${{ env.ZLIB_VERSION }}/*.o

      # ── HDF5 ─────────────────────────────────────────────────────────────
      - name: Build HDF5 for iOS (arm64, shared)
        run: |
          curl -LO https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-1.14/hdf5-${{ env.HDF5_VERSION }}/src/hdf5-${{ env.HDF5_VERSION }}.tar.gz
          tar xzf hdf5-${{ env.HDF5_VERSION }}.tar.gz
          cd hdf5-${{ env.HDF5_VERSION }}
          CC="$IOS_CC" \
          CFLAGS="-arch arm64 -isysroot $IOS_SDK -miphoneos-version-min=${{ env.IOS_MIN_VERSION }}" \
          CPPFLAGS="-I$DEPS_DIR/include" \
          LDFLAGS="-L$DEPS_DIR/lib" \
          ac_cv_have_decl_H5Pget_fapl_mpio=no \
          ./configure \
            --prefix=$DEPS_DIR \
            --host=aarch64-apple-darwin \
            --enable-shared \
            --disable-static \
            --disable-tests \
            --disable-tools \
            --disable-parallel \
            --with-zlib=$DEPS_DIR \
            ac_cv_sizeof_long_double=8 \
            hdf5_cv_ldouble_to_long_special=no \
            hdf5_cv_long_to_ldouble_special=no \
            hdf5_cv_ldouble_to_uint_accurate=yes \
            hdf5_cv_ldouble_to_integer_works=yes
          make -j$(sysctl -n hw.ncpu)
          make install
          # Fix install names
          install_name_tool -id @rpath/libhdf5.dylib $DEPS_DIR/lib/libhdf5.dylib 2>/dev/null || true
          install_name_tool -id @rpath/libhdf5_hl.dylib $DEPS_DIR/lib/libhdf5_hl.dylib 2>/dev/null || true

      # ── libnetcdf ─────────────────────────────────────────────────────────
      - name: Create iOS CMake toolchain file
        run: |
          cat > $GITHUB_WORKSPACE/ios-toolchain.cmake << EOF
          set(CMAKE_SYSTEM_NAME iOS)
          set(CMAKE_OSX_ARCHITECTURES arm64)
          set(CMAKE_OSX_SYSROOT $IOS_SDK)
          set(CMAKE_OSX_DEPLOYMENT_TARGET ${{ env.IOS_MIN_VERSION }})
          set(CMAKE_C_COMPILER $IOS_CC)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(CMAKE_FIND_ROOT_PATH $DEPS_DIR)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: Build libnetcdf for iOS (arm64, shared)
        run: |
          curl -LO https://github.com/Unidata/netcdf-c/archive/refs/tags/v${{ env.NETCDF_VERSION }}.tar.gz
          tar xzf v${{ env.NETCDF_VERSION }}.tar.gz
          sed -i.bak '/#include <mpi.h>/d' netcdf-c-${{ env.NETCDF_VERSION }}/include/ncdispatch.h
          sed -i.bak2 '1s/^/typedef int MPI_Comm;\ntypedef int MPI_Info;\n/' netcdf-c-${{ env.NETCDF_VERSION }}/include/ncdispatch.h
          sed -i.bak3 's/_filelengthi64(fd)/lseek(fd, 0, SEEK_END)/g' netcdf-c-${{ env.NETCDF_VERSION }}/libsrc/posixio.c
          sed -i.bak4 's/H5Pset_all_coll_metadata_ops(fapl_id, 1)/0/g' netcdf-c-${{ env.NETCDF_VERSION }}/libhdf5/hdf5create.c
          sed -i.bak5 's/H5Pset_coll_metadata_write(fapl_id, 1)/0/g' netcdf-c-${{ env.NETCDF_VERSION }}/libhdf5/hdf5create.c
          sed -i.bak6 's/_filelengthi64(nciop->fd)/lseek(nciop->fd, 0, SEEK_END)/g' netcdf-c-${{ env.NETCDF_VERSION }}/libsrc/posixio.c
          sed -i.bak7 's/mremap(mmapio->memory,mmapio->alloc,newsize,MREMAP_MAYMOVE)/(void*)MAP_FAILED/g' netcdf-c-${{ env.NETCDF_VERSION }}/libsrc/mmapio.c
          cd netcdf-c-${{ env.NETCDF_VERSION }}
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/ios-toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DCMAKE_PREFIX_PATH=$DEPS_DIR \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_NAME_DIR=@rpath \
            -DCMAKE_SHARED_LINKER_FLAGS="-install_name @rpath/libnetcdf.dylib -L$DEPS_DIR/lib -lhdf5 -lhdf5_hl -lz" \
            -DENABLE_TESTS=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DENABLE_DAP=OFF \
            -DENABLE_BYTERANGE=OFF \
            -DENABLE_NETCDF_4=ON \
            -DENABLE_PARALLEL4=OFF \
            -DENABLE_PNETCDF=OFF \
            -DENABLE_PARALLEL_TESTS=OFF \
            -DENABLE_MMAP=OFF \
            -DHDF5_C_LIBRARY_hdf5=$DEPS_DIR/lib/libhdf5.dylib \
            -DHDF5_C_LIBRARY_hdf5_hl=$DEPS_DIR/lib/libhdf5_hl.dylib \
            -DHDF5_INCLUDE_DIR=$DEPS_DIR/include \
            -DHDF5_C_INCLUDE_DIR=$DEPS_DIR/include
          make -j$(sysctl -n hw.ncpu)
          make install
          install_name_tool -id @rpath/libnetcdf.dylib $DEPS_DIR/lib/libnetcdf.dylib 2>/dev/null || true
      # ── Briefcase iOS scaffold ────────────────────────────────────────────
      - name: Create Briefcase iOS project (downloads iOS Python)
        run: |
          briefcase create iOS --no-input 2>&1 || true
          # Find the iOS Python binary - arm64 device only, not simulator
          IOS_PY=$(find $GITHUB_WORKSPACE/build -name "python3.11" -type f 2>/dev/null \
                   | grep "ios-arm64/bin" | grep -v simulator | head -1)
          if [ -z "$IOS_PY" ]; then
            IOS_PY=$(find ~/.cache/briefcase -name "python3.11" -type f 2>/dev/null \
                     | grep -v simulator | head -1)
          fi
          echo "IOS_PYTHON=$IOS_PY" >> $GITHUB_ENV
          echo "Found iOS Python: $IOS_PY"

      - name: Debug - Find iOS Python location
        run: |
          echo "=== Briefcase cache ==="
          find ~/.cache/briefcase -name "python3*" -type f 2>/dev/null | head -20 || true
          find ~/Library/Caches -name "python3*" -type f 2>/dev/null | head -20 || true
          echo "=== Build dir ==="
          find $GITHUB_WORKSPACE/build -name "python3*" 2>/dev/null | head -20 || true
      # ── netCDF4 Python wheel ───────────────────────────────────────────────
      # - name: Build netCDF4 wheel for iOS Python
      #   run: |
      #     # Create minimal _sysconfigdata for crossenv
      #     PY_LIB=$(dirname "$IOS_PYTHON")/../lib/python3.11
      #     mkdir -p "$PY_LIB"
      #     python3 -c "
      #     import sysconfig
      #     d = sysconfig.get_config_vars()
      #     d['CC'] = 'clang'
      #     d['CXX'] = 'clang++'
      #     d['CFLAGS'] = '-arch arm64'
      #     d['CXXFLAGS'] = '-arch arm64'
      #     d['LDFLAGS'] = ''
      #     d['LDSHARED'] = 'clang -bundle'
      #     d['EXT_SUFFIX'] = '.cpython-311-darwin.so'
      #     d['SOABI'] = 'cpython-311-darwin'
      #     d['HOST_GNU_TYPE'] = 'aarch64-apple-darwin'
      #     d['BUILD_GNU_TYPE'] = 'aarch64-apple-darwin'
      #     print('build_time_vars = ' + repr(d))
      #     " > "$PY_LIB/_sysconfigdata__darwin_arm64-apple-ios.py"
      #     python -m crossenv "$IOS_PYTHON" cross-venv
      #     source cross-venv/bin/activate
      #     export NETCDF4_DIR=$DEPS_DIR
      #     export HDF5_DIR=$DEPS_DIR
      #     export ZLIB_DIR=$DEPS_DIR
      #     export CFLAGS="-arch arm64 -isysroot $IOS_SDK -miphoneos-version-min=${{ env.IOS_MIN_VERSION }}"
      #     export LDFLAGS="-L$DEPS_DIR/lib -lnetcdf -lhdf5_hl -lhdf5 -lz"
      #     pip install --no-binary :all: netCDF4==${{ env.NETCDF4_PY_VERSION }}
      #     find cross-venv -name "netCDF4*.whl" -exec cp {} $GITHUB_WORKSPACE/ \; 2>/dev/null || true
      
      - name: Install pure-Python netCDF reader into app
        run: |
          APP_SRC=$GITHUB_WORKSPACE/src/inetcdf_app
          cat > "$APP_SRC/ncreader.py" << 'EOF'
          import struct

          def ncdump_h(path):
              with open(path, 'rb') as f:
                  magic = f.read(4)
                  if magic[:3] == b'CDF':
                      return _read_nc3(path)
                  elif magic[:4] == b'\x89HDF':
                      return f"NetCDF-4/HDF5 file: {path}\n(Full header parsing requires netCDF4 library)"
                  else:
                      return f"Unknown format: {magic!r}"

          def _read_nc3(path):
              # parse NetCDF classic header
              ...
          EOF

      # ── Briefcase build ───────────────────────────────────────────────────
      - name: Build iOS app (no signing)
        run: |
          briefcase build iOS --no-input 2>&1 || true
          # Find the actual app project, not the testbed
          XCODE_PROJ=$(find $GITHUB_WORKSPACE/build -name "*.xcodeproj" \
                       | grep -v testbed | head -1)
          SCHEME=$(basename "$XCODE_PROJ" .xcodeproj)
          echo "Building project $XCODE_PROJ with scheme $SCHEME"
          xcodebuild \
            -project "$XCODE_PROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      # ── Package as .ipa ───────────────────────────────────────────────────
      - name: Package .ipa
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" \
                -path "*/Debug-iphoneos/*" \
                -not -path "*/testbed/*" \
                | head -1)
          echo "Packaging: $APP"
          # Bundle dylibs into Frameworks/
          mkdir -p "$APP/Frameworks"
          cp $DEPS_DIR/lib/libnetcdf.dylib "$APP/Frameworks/"
          cp $DEPS_DIR/lib/libhdf5.dylib "$APP/Frameworks/"
          cp $DEPS_DIR/lib/libhdf5_hl.dylib "$APP/Frameworks/"
          cp $DEPS_DIR/lib/libz.dylib "$APP/Frameworks/"
          # Re-sign everything with ad-hoc
          find "$APP/Frameworks" -name "*.dylib" -exec \
            codesign -f -s "-" {} \;
          codesign -f -s "-" "$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r iNetCDF.ipa Payload/

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iNetCDF-iOS
          path: iNetCDF.ipa
          retention-days: 7